  test/unit/obsidian/commands.test.ts: ["[[obsidian-layer]]"]
  test/unit/obsidian/composer.test.ts: ["[[obsidian-layer]]"]
  test/unit/obsidian/discovery.test.ts: ["[[obsidian-layer]]"]
  test/unit/obsidian/manager.test.ts: ["[[obsidian-layer]]", "[[conversation]]"]
