  test/unit/claude.test.ts: ["[[agents]]"]
  test/unit/codex.test.ts: ["[[agents]]"]
  test/unit/colors.test.ts: ["[[module-sdk]]"]
  test/unit/conversation.test.ts: ["[[conversation]]"]
  test/unit/document.test.ts: ["[[documents]]"]
  test/unit/esbuild.test.ts: ["[[build]]"]
  test/unit/module.test.ts: ["[[module-sdk]]"]
  test/unit/office.test.ts: ["[[wiki-changes-ingest]]"]
  test/unit/reads.test.ts: ["[[wiki]]"]
  test/unit/review.test.ts: ["[[module-sdk]]"]
  test/unit/run.test.ts: ["[[module-sdk]]"]
  test/unit/runtime.test.ts: ["[[module-sdk]]"]
  test/unit/session.test.ts: ["[[module-sdk]]"]
  test/unit/support.test.ts: ["[[module-sdk]]"]
  test/unit/testing.test.ts: ["[[testing]]"]
  test/unit/text-ops.test.ts: ["[[documents]]"]
  test/unit/threads.test.ts: ["[[threads]]"]
  test/unit/vault-flows.test.ts: ["[[module-sdk]]"]
  test/unit/vault-modules.test.ts: ["[[module-sdk]]"]
  test/unit/wiki.test.ts: ["[[wiki]]"]
  test/unit/obsidian/collab.test.ts: ["[[collab]]"]
