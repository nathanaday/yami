version: 1
parts:
  - {path: src/, description: "Library source; one folder per package export."}
  - {path: src/module/, description: "SDK: modules, runs, review, tools, threads and wiki built-in modules."}
  - {path: src/agent/, description: "Claude and Codex harness adapters."}
  - {path: src/document/, description: "Vault documents and text ops, no Obsidian."}
  - {path: src/wiki/, description: "Wiki index, algorithms, lint, changes, versions."}
  - {path: src/obsidian/, description: "The only code using Obsidian, CodeMirror and DOM."}
  - {path: src/testing/, description: "Node test helpers."}
  - {path: test/unit/, description: "Unit tests (vitest) with fake harnesses in test/fixtures."}
  - {path: test/live/, description: "Live tests against real harnesses; not run."}
  - {path: bench/, description: "Wiki search benchmark."}
features:
  module-sdk:
    code: [src/index.ts, src/module]
    notes: "YamiModule in module.ts, runs in run.ts/agent-run.ts/fresh-run.ts, review.ts."
  agents:
    code: [src/agent]
  documents:
    code: [src/document]
  wiki:
    code: [src/wiki]
  wiki-changes-ingest:
    code: [src/wiki/change.ts, src/wiki/source.ts, src/module/wiki]
  threads:
    code: [src/threads, src/module/threads]
  conversation:
    code: [src/conversation]
  obsidian-layer:
    code: [src/obsidian]
  collab:
    code: [src/obsidian/collab]
  testing:
    code: [src/testing]
  build:
    code: [src/build]
