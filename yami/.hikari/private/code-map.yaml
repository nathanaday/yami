version: 1
parts:
  - {path: yami/yami/src/, description: "Library source; one folder per package export."}
  - {path: yami/yami/src/module/, description: "SDK: modules, runs, review, tools; built-in wiki and threads modules."}
  - {path: yami/yami/src/agent/, description: "Claude and Codex harness adapters."}
  - {path: yami/yami/test/unit/, description: "Unit tests (vitest) with fake harnesses in test/fixtures."}
  - {path: yami/yami/test/fixtures/, description: "Fake claude and codex executables, office fixtures."}
  - {path: yami/yami/test/live/, description: "Live tests against real harnesses; not run."}
  - {path: yami/yami/bench/, description: "Wiki search benchmark; needs a vault and a Voyage key; not run."}
