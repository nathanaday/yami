# Releases the library when main holds a version that no release has yet. A push to main (a merge,
# or a direct push) reads yami/package.json, and stops when the release yami-X.Y.Z exists, so a change
# that bumps no version publishes nothing. The release holds yami-X.Y.Z.tgz, which a plugin's
# package.json names as its yami dependency.
#
# To release: npm version X.Y.Z --no-git-tag-version in yami/, set VERSION in src/version.ts, add the
# CHANGELOG entry, commit, push to main. See docs/releasing.md.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  library:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: yami
    steps:
      - uses: actions/checkout@v7
      - name: Read the version, and whether it is released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "yami-$version" >/dev/null 2>&1; then
            echo "yami $version is released already; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yami/package-lock.json
      - if: steps.version.outputs.new == 'true'
        run: npm ci
      - if: steps.version.outputs.new == 'true'
        run: npm run build
      - if: steps.version.outputs.new == 'true'
        run: npm test
      - if: steps.version.outputs.new == 'true'
        run: npm pack
      - name: Tag the commit and publish the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "yami-$VERSION" \
            --target "$GITHUB_SHA" \
            --title "yami $VERSION" \
            --notes "The yami library $VERSION. A plugin takes it as a dependency by this file's URL. The changes are in yami/CHANGELOG.md." \
            "yami-$VERSION.tgz"

