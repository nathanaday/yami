# The checks of every change to the library: its build and its unit tests, on each push to main and
# on each pull request. The plugins live in their own repositories (yami-wiki, yami-threads, duet),
# each with checks of its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yami
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yami/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
