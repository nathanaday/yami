version: 1
parts:
  - path: obsidian_plugin/src/
    description: Plugin source - entry, shared ui helpers, panel and navigator views.
  - path: obsidian_plugin/test/unit/
    description: Fast unit tests against the yami library's testing helper.
  - path: obsidian_plugin/test/obsidian/
    description: End-to-end tests driving a real Obsidian through playwright.
  - path: obsidian_plugin/test/fixtures/
    description: Sample vault and the Hello vault module.
features:
  plugin-setup:
    code: [obsidian_plugin/src/main.ts, obsidian_plugin/manifest.json, obsidian_plugin/esbuild.config.mjs]
    notes: onload() calls createYami and registers both views.
  panel:
    code: [obsidian_plugin/src/panel/view.ts, obsidian_plugin/src/panel/panel.css, obsidian_plugin/src/ui.ts]
    notes: YamiPanel in view.ts, 654 lines.
  wiki-proposals:
    code: [obsidian_plugin/src/panel/view.ts]
  diff-view:
    code: [obsidian_plugin/src/panel/diff.ts]
    notes: diffLines().
  wiki-navigator:
    code: [obsidian_plugin/src/navigator/view.ts, obsidian_plugin/src/navigator/navigator.css]
  vault-modules:
    code: [obsidian_plugin/test/fixtures/vault-modules/hello]
    notes: Behavior lives in the library; the plugin only shows it.
  conversations:
    code: [obsidian_plugin/src/main.ts]
    notes: Behavior lives in the library.
