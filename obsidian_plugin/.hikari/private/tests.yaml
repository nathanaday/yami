version: 1
suites:
  unit:
    command: cd yami/obsidian_plugin && npm run build && npx vitest run test/unit --reporter=default --reporter=junit --outputFile=/hikari/private/reports/unit.xml
    description: Fast unit tests against the testing helper of yami 0.19.0 (yami-library release). Runs the build first.
  obsidian:
    command: cd yami/obsidian_plugin && npx vitest run test/obsidian --reporter=default --reporter=junit --outputFile=/hikari/private/reports/obsidian.xml
    description: End-to-end tests driving a real Obsidian through playwright, with yami 0.19.0 (yami-library release). Needs Obsidian and live agents.
tests:
  yami/obsidian_plugin/test/unit/diff.test.ts: ["[[diff-view]]"]
  yami/obsidian_plugin/test/unit/hello.test.ts: ["[[vault-modules]]"]
  yami/obsidian_plugin/test/obsidian/plugin.test.ts: ["[[plugin-setup]]", "[[panel]]"]
  "yami/obsidian_plugin/test/obsidian/plugin.test.ts > Yami in Obsidian > lists the wiki's proposals in the panel, approves one, rejects one with a reason, refuses one that no longer fits, and runs the commands": ["[[wiki-proposals]]", "[[diff-view]]", "[[panel]]"]
  "yami/obsidian_plugin/test/obsidian/plugin.test.ts > Yami in Obsidian > walks the wiki by its tags in the navigator, and follows the open note": ["[[wiki-navigator]]", "[[plugin-setup]]"]
  "yami/obsidian_plugin/test/obsidian/plugin.test.ts > Yami in Obsidian > writes the exchange into the note and names the note": ["[[conversations]]"]
  "yami/obsidian_plugin/test/obsidian/plugin.test.ts > Yami in Obsidian > asks in the message box before an edit, and edits an open note while the user types in it": ["[[conversations]]"]
  "yami/obsidian_plugin/test/obsidian/plugin.test.ts > Yami in Obsidian > shows the agent's questions in the message box and sends the answers": ["[[conversations]]"]
  "yami/obsidian_plugin/test/obsidian/plugin.test.ts > Yami in Obsidian > applies a new approval mode to the request that waits": ["[[conversations]]"]
  "yami/obsidian_plugin/test/obsidian/plugin.test.ts > Yami in Obsidian > ends the conversation and keeps the note as a record": ["[[conversations]]"]
  "yami/obsidian_plugin/test/obsidian/plugin.test.ts > Yami in Obsidian > talks to Codex in a Codex conversation": ["[[conversations]]", "[[plugin-setup]]"]
  "yami/obsidian_plugin/test/obsidian/plugin.test.ts > Yami in Obsidian > calls a module tool from both agents": ["[[conversations]]"]
  "yami/obsidian_plugin/test/obsidian/plugin.test.ts > Yami in Obsidian > starts a conversation for another plugin and reports its turns": ["[[conversations]]"]
  "yami/obsidian_plugin/test/obsidian/plugin.test.ts > Yami in Obsidian > creates the hello module with New module, and the panel shows it with no reload": ["[[vault-modules]]", "[[panel]]"]
  "yami/obsidian_plugin/test/obsidian/plugin.test.ts > Yami in Obsidian > shows a broken flow's problem and an edited base skill in the panel, and drops the module when its folder goes, with no reload": ["[[vault-modules]]", "[[panel]]"]
  "vitest unhandled errors": []
gaps:
  panel: [Keyboard use is not tested on its own.]
  plugin-setup: [The developer console handle is not tested.]
